name: Dados
description: Baixa a branch `dados` para ./dados e valida antes do build
runs:
  using: composite
  steps:
    - shell: bash
      env:
        # O repositório é privado: o clone usa o token do próprio workflow
        REPO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
      run: |
        if git ls-remote --exit-code --heads "$REPO" dados > /dev/null; then
          git clone --quiet --depth 1 --branch dados "$REPO" dados
          rm -rf dados/.git
          # Cargas anteriores à lista de pessoas: gera a partir de Câmara e Senado
          if [ ! -f dados/pessoas.json ] && [ -d dados/camara/deputados ]; then
            pnpm etl:pessoas --dados dados
          fi
          pnpm etl:validar dados
        else
          echo "::notice::Branch dados ainda não existe; build sem dados."
        fi
