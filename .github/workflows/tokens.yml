name: Tokens das redes

on:
  # Toda segunda: renova o token do Threads (vence em 60 dias) e confere o da Meta
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:
    inputs:
      so_conferir:
        description: Só conferir o acesso do TOKEN_SECRETS, sem renovar
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  threads:
    name: threads
    runs-on: ubuntu-latest
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      # Token pessoal com permissão só de escrever secrets neste repositório
      # (o GITHUB_TOKEN dos workflows não pode alterar secrets)
      GH_TOKEN: ${{ secrets.TOKEN_SECRETS }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Conferir os secrets
        run: |
          if [ -z "$THREADS_ACCESS_TOKEN" ]; then
            echo "::notice::THREADS_ACCESS_TOKEN ainda não configurado; nada a renovar."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta o secret TOKEN_SECRETS para gravar o token renovado."
            exit 1
          fi
          # Falha cedo se o token pessoal venceu ou perdeu o acesso ao repositório
          if ! gh secret list --repo "${{ github.repository }}" > /dev/null; then
            echo "::error::TOKEN_SECRETS sem acesso aos secrets do repositório (vencido ou criado para outro dono)."
            exit 1
          fi
          echo "TOKEN_SECRETS com acesso aos secrets do repositório."
          if [ "${{ inputs.so_conferir }}" = "true" ]; then exit 0; fi
          echo "RENOVAR=true" >> "$GITHUB_ENV"
      # Se falhar, o GitHub avisa por e-mail; o token antigo segue valendo até vencer
      - name: Renovar o token do Threads
        if: env.RENOVAR == 'true'
        run: |
          set -o pipefail
          pnpm -s exec tsx scripts/social/renovar-threads.ts \
            | gh secret set THREADS_ACCESS_TOKEN --repo "${{ github.repository }}"

  # O token da Página não vence, mas a Meta o invalida se a senha mudar ou o
  # app perder a permissão. Se falhar, o GitHub avisa por e-mail.
  meta:
    name: meta
    runs-on: ubuntu-latest
    env:
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
    steps:
      - name: Conferir o token da Página (Facebook e Instagram)
        run: |
          if [ -z "$META_PAGE_TOKEN" ]; then
            echo "::notice::META_PAGE_TOKEN ainda não configurado."
            exit 0
          fi
          resposta=$(curl -s "https://graph.facebook.com/v24.0/me?fields=name,instagram_business_account" \
            --data-urlencode "access_token=$META_PAGE_TOKEN" -G)
          if ! echo "$resposta" | jq -e '.id' > /dev/null; then
            echo "::error::Token da Página inválido: $(echo "$resposta" | jq -c '.error.message')"
            exit 1
          fi
          echo "Página: $(echo "$resposta" | jq -r '.name')"
          if ! echo "$resposta" | jq -e '.instagram_business_account.id' > /dev/null; then
            echo "::warning::A Página não tem Instagram profissional vinculado."
          fi
