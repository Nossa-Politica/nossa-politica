name: Tokens das redes

on:
  # Toda segunda: o token do Threads vence em 60 dias se não for renovado
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  threads:
    name: threads
    runs-on: ubuntu-latest
    env:
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      # Token pessoal com permissão só de escrever secrets neste repositório
      # (o GITHUB_TOKEN dos workflows não pode alterar secrets)
      GH_TOKEN: ${{ secrets.TOKEN_SECRETS }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Conferir os secrets
        run: |
          if [ -z "$THREADS_ACCESS_TOKEN" ]; then
            echo "::notice::THREADS_ACCESS_TOKEN ainda não configurado; nada a renovar."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta o secret TOKEN_SECRETS para gravar o token renovado."
            exit 1
          fi
          echo "RENOVAR=true" >> "$GITHUB_ENV"
      # Se falhar, o GitHub avisa por e-mail; o token antigo segue valendo até vencer
      - name: Renovar o token do Threads
        if: env.RENOVAR == 'true'
        run: |
          set -o pipefail
          pnpm -s exec tsx scripts/social/renovar-threads.ts \
            | gh secret set THREADS_ACCESS_TOKEN --repo "${{ github.repository }}"
